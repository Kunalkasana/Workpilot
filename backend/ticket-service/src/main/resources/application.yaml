spring:
  application:
    name: ticket-service

  datasource:
    url: jdbc:postgresql://localhost:5432/workpilot_tickets
    username: workpilot_app
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        register: true
        service-name: ticket-service
        prefer-ip-address: true
server:
  port: 8082
