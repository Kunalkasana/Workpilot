spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/workpilot_auth
    username: workpilot_app
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  application:
    name: auth-service
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        register: true
        service-name: auth-service
        prefer-ip-address: true
server:
  port: 8081